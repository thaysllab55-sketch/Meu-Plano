<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f8f3f5"><title>Meu Plano</title><style>:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color:#332b35;background:#faf7f8}*{box-sizing:border-box}body{margin:0;padding:20px 16px 95px;max-width:650px;margin:auto}header{display:flex;justify-content:space-between;align-items:center}h1{margin:4px 0;font-size:29px}h2{font-size:18px;margin:0 0 14px}.muted{color:#807681;font-size:13px}.card{background:white;border:1px solid #eee3e8;border-radius:18px;padding:17px;margin:15px 0;box-shadow:0 3px 12px #45304008}.pill{background:#f5e6ed;color:#954c72;border-radius:30px;padding:6px 10px;font-size:12px;font-weight:700}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.stack{display:grid;gap:10px}.stat{flex:1;background:#fff;border:1px solid #eee3e8;padding:13px;border-radius:14px}.stat strong{font-size:23px;display:block;margin-top:4px}.btn{border:0;border-radius:12px;padding:12px 15px;background:#9d5278;color:white;font-weight:700;font-size:14px;cursor:pointer}.btn.secondary{background:#f4e7ed;color:#82405f}.btn.light{background:#f5f2f3;color:#51434b}.btn:active{transform:scale(.98)}input,textarea,select{border:1px solid #e7d9df;border-radius:10px;padding:11px;width:100%;font:inherit;background:#fff;color:#332b35}input[type=checkbox]{width:21px;height:21px;accent-color:#9d5278}label{font-size:13px;font-weight:600}textarea{min-height:60px;resize:vertical}.meal{display:flex;align-items:flex-start;gap:12px;border-top:1px solid #f2ebee;padding:12px 0}.meal p{margin:4px 0;color:#716670;font-size:14px;white-space:pre-wrap}.meal .grow{flex:1}.meal button{border:0;background:none;color:#9d5278;font-size:13px}.progress{height:9px;background:#f1e8ec;border-radius:9px;overflow:hidden;margin:10px 0}.progress span{height:100%;background:#a86184;display:block;transition:width .2s}.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #eadde4;display:flex;justify-content:space-around;padding:10px 4px calc(10px + env(safe-area-inset-bottom));z-index:3}.nav button{border:0;background:none;color:#8a7b84;font-size:11px;font-weight:600;display:grid;gap:5px;justify-items:center;min-width:60px}.nav button.active{color:#984b72}.nav b{font-size:20px}.hide{display:none!important}.field{display:grid;gap:6px;margin:12px 0}.small{font-size:12px}.history{border-top:1px solid #eee;padding:11px 0;font-size:14px}.tag{font-size:12px;color:#87506d;background:#f9edf2;border-radius:8px;padding:5px 8px}.flex{display:flex;gap:8px;align-items:center}.flex>*{min-width:0}button:focus-visible,input:focus-visible{outline:3px solid #d4a4bc}#toast{position:fixed;bottom:85px;left:50%;transform:translateX(-50%);background:#332b35;color:white;padding:10px 16px;border-radius:12px;display:none;z-index:10;white-space:nowrap}@media(min-width:650px){.nav{max-width:650px;left:50%;transform:translateX(-50%);border-radius:20px 20px 0 0}}</style></head><body>
<header><div><div class="muted">SUA ROTINA, NO SEU RITMO</div><h1>Meu Plano ♡</h1></div><span class="pill">Versão 1.0</span></header><div id="today" class="page"></div><div id="menu" class="page hide"></div><div id="water" class="page hide"></div><div id="evolution" class="page hide"></div><div id="settings" class="page hide"></div><nav class="nav" aria-label="Navegação"><button data-tab="today" class="active"><b>⌂</b>Hoje</button><button data-tab="menu"><b>▤</b>Cardápio</button><button data-tab="water"><b>◉</b>Água</button><button data-tab="evolution"><b>↗</b>Evolução</button><button data-tab="settings"><b>⚙</b>Ajustes</button></nav><div id="toast" role="status"></div>
<script>
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const names=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
const base=[
[['Café reforçado','Pão francês + 2 ovos + queijo'],['Refeição intermediária','Vitamina: banana + leite + whey'],['Jantar','Arroz + carne de panela + batata']],
[['Café da manhã','2 ovos cozidos + pão com doce de leite + café'],['Almoço','60 g arroz + 110–115 g carne desfiada com batata'],['Sobremesa','Gelatina zero'],['Lanche da tarde','Whey + morango congelado + leite'],['Jantar','Macarrão + carne moída']],
[['Café da manhã','2 ovos + pão + café'],['Almoço','Arroz + carne desfiada com batata'],['Sobremesa','Gelatina zero'],['Lanche da tarde','Whey + morango + leite'],['Jantar','Tilápia + purê']],
[['Café da manhã','2 ovos + pão com doce de leite'],['Almoço','Arroz + carne desfiada com batata'],['Sobremesa','Gelatina zero'],['Lanche da tarde','Whey + morango + leite'],['Jantar','Frango + arroz + requeijão']],
[['Café da manhã','2 ovos + pão + café'],['Almoço','Arroz + carne desfiada com batata'],['Sobremesa','Gelatina zero'],['Lanche da tarde','Whey + morango + leite'],['Jantar','Carne de panela + purê']],
[['Café da manhã','2 ovos + pão com doce de leite'],['Almoço','Arroz + carne desfiada com batata'],['Sobremesa','Gelatina zero'],['Lanche da tarde','Whey + morango + leite'],['Jantar','Hambúrguer caseiro']],
[['Café reforçado','Pão francês + ovos + queijo'],['Refeição intermediária','Vitamina: banana + leite + whey'],['Jantar','Macarrão + carne moída']]
].map(a=>a.map(([name,desc])=>({id:crypto.randomUUID?crypto.randomUUID():Math.random().toString(36),name,desc,protein:0})));
const defaults={waterGoal:2000,proteinGoal:100,weightGoal:56,startingWeight:72,menu:base,days:{},weights:[]};let data;try{data=JSON.parse(localStorage.getItem('meu-plano-v1'))||structuredClone(defaults)}catch{data=structuredClone(defaults)};data={...structuredClone(defaults),...data};let selectedDay=new Date().getDay();let tab='today';
function save(){try{localStorage.setItem('meu-plano-v1',JSON.stringify(data))}catch{toast('Não foi possível salvar neste navegador')}}
function dateKey(d=new Date()){return [d.getFullYear(),String(d.getMonth()+1).padStart(2,'0'),String(d.getDate()).padStart(2,'0')].join('-')}
function day(k=dateKey()){return data.days[k]||(data.days[k]={water:0,extraProtein:0,checked:{}})}
function toast(t){$('#toast').textContent=t;$('#toast').style.display='block';setTimeout(()=>$('#toast').style.display='none',2000)}
function switchTab(t){tab=t;document.querySelectorAll('.page').forEach(x=>x.classList.toggle('hide',x.id!==t));document.querySelectorAll('.nav button').forEach(x=>x.classList.toggle('active',x.dataset.tab===t));render();window.scrollTo(0,0)}
function render(){const now=new Date(),k=dateKey(),d=day(k),meals=data.menu[now.getDay()],checked=meals.filter(m=>d.checked[m.id]).length;let prot=d.extraProtein+meals.reduce((s,m)=>s+(d.checked[m.id]?Number(m.protein)||0:0),0);$('#today').innerHTML=`<div class="muted">${now.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})}</div><div class="row" style="margin:15px 0"><div class="stat"><span class="muted">Água</span><strong>${d.water} ml</strong><span class="small muted">Meta ${data.waterGoal} ml</span></div><div class="stat"><span class="muted">Proteína registrada</span><strong>${prot.toFixed(0)} g</strong><span class="small muted">Meta ${data.proteinGoal} g</span></div></div><div class="card"><div class="row"><h2>Refeições de hoje</h2><span class="tag">${checked}/${meals.length} feitas</span></div><div class="progress"><span style="width:${100*checked/Math.max(1,meals.length)}%"></span></div>${meals.map(m=>`<div class="meal"><input aria-label="Marcar ${esc(m.name)}" type="checkbox" data-check="${esc(m.id)}" ${d.checked[m.id]?'checked':''}><div class="grow"><strong>${esc(m.name)}</strong><p>${esc(m.desc)}</p>${m.protein?`<span class="muted small">${m.protein} g proteína estimada</span>`:''}</div></div>`).join('')}<button class="btn secondary" data-go="menu">Editar cardápio</button></div><div class="card"><h2>Registro rápido</h2><div class="row"><button class="btn secondary" data-water="250">+ 250 ml água</button><button class="btn secondary" data-water="500">+ 500 ml água</button></div><div class="field"><label for="extra">Proteína adicional consumida hoje (g)</label><input id="extra" type="number" min="0" max="300" step="1" value="${d.extraProtein}"></div><p class="muted">Proteína das refeições só entra no total se informares os gramas no cardápio e marcares a refeição. Sem isso, o total pode ficar incompleto.</p></div>`;
$('#menu').innerHTML=`<div class="card"><h2>Cardápio semanal</h2><p class="muted">Escolhe o dia, edita as refeições e informa a proteína aproximada se souberes.</p><div class="field"><label for="weekday">Dia da semana</label><select id="weekday">${names.map((n,i)=>`<option value="${i}" ${i===selectedDay?'selected':''}>${n}</option>`).join('')}</select></div>${data.menu[selectedDay].map(m=>`<div class="meal"><div class="grow"><strong>${esc(m.name)}</strong><p>${esc(m.desc)}</p><span class="muted small">Proteína: ${m.protein||0} g</span></div><button data-edit="${esc(m.id)}">Editar</button><button data-delete="${esc(m.id)}" aria-label="Excluir">×</button></div>`).join('')}<button class="btn" id="addMeal">+ Adicionar refeição</button></div>`;
$('#water').innerHTML=`<div class="card"><h2>Água de hoje</h2><strong style="font-size:34px">${d.water} <span class="muted">/ ${data.waterGoal} ml</span></strong><div class="progress"><span style="width:${Math.min(100,d.water/data.waterGoal*100)}%"></span></div><div class="row"><button class="btn" data-water="250">+ 250 ml</button><button class="btn" data-water="500">+ 500 ml</button><button class="btn light" data-water="-250">− 250 ml</button></div><p class="muted">Meta editável em Ajustes. Ajusta a quantidade às tuas necessidades e à orientação profissional.</p></div><div class="card"><h2>Últimos registros</h2>${Object.entries(data.days).filter(([k,v])=>v.water>0).sort((a,b)=>b[0].localeCompare(a[0])).slice(0,14).map(([k,v])=>`<div class="history row"><span>${k.split('-').reverse().join('/')}</span><strong>${v.water} ml</strong></div>`).join('')||'<p class="muted">Nenhum registro ainda.</p>'}</div>`;
const ws=[...data.weights].sort((a,b)=>b.date.localeCompare(a.date));$('#evolution').innerHTML=`<div class="card"><h2>Acompanhamento de peso</h2><div class="row"><div class="stat"><span class="muted">Inicial</span><strong>${data.startingWeight} kg</strong></div><div class="stat"><span class="muted">Último</span><strong>${ws.length?ws[0].kg+' kg':'—'}</strong></div><div class="stat"><span class="muted">Meta</span><strong>${data.weightGoal} kg</strong></div></div><div class="field"><label for="weightDate">Data</label><input type="date" id="weightDate" value="${k}"></div><div class="field"><label for="weightKg">Peso pela manhã (kg)</label><input type="number" id="weightKg" min="20" max="350" step="0.1" placeholder="Ex.: 72,0"></div><button class="btn" id="saveWeight">Salvar peso</button><p class="muted">Observe a tendência de semanas, não as variações de um único dia.</p></div><div class="card"><h2>Histórico de pesagens</h2>${ws.length?ws.map(w=>`<div class="history row"><span>${w.date.split('-').reverse().join('/')}</span><strong>${w.kg} kg</strong><button class="btn light" data-delweight="${w.date}">Excluir</button></div>`).join(''):'<p class="muted">Registra tua primeira pesagem.</p>'}</div>`;
$('#settings').innerHTML=`<div class="card"><h2>Metas editáveis</h2>${[['waterGoal','Meta de água (ml)',250,6000,50],['proteinGoal','Meta de proteína (g)',20,250,5],['startingWeight','Peso inicial (kg)',20,350,0.1],['weightGoal','Meta de peso (kg)',20,350,0.1]].map(([id,label,min,max,step])=>`<div class="field"><label for="${id}">${label}</label><input type="number" id="${id}" min="${min}" max="${max}" step="${step}" value="${data[id]}"></div>`).join('')}<button class="btn" id="saveSettings">Salvar metas</button></div><div class="card"><h2>Backup e privacidade</h2><p class="muted">Os dados ficam neste navegador e neste aparelho. Apagar os dados do navegador, usar navegação privada ou trocar de iPhone pode eliminar o histórico. Não há conta nem sincronização.</p><div class="stack"><button class="btn secondary" id="export">Exportar backup (.json)</button><label for="import" class="btn light" style="text-align:center">Importar backup (.json)</label><input type="file" id="import" accept="application/json,.json" style="display:none"><button class="btn light" id="reset">Apagar todos os dados</button></div></div>`;
}
document.addEventListener('click',async e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.tab){switchTab(b.dataset.tab);return}if(b.dataset.go){switchTab(b.dataset.go);return}if(b.dataset.water){day().water=Math.max(0,day().water+Number(b.dataset.water));save();render();return}if(b.dataset.edit){let m=data.menu[selectedDay].find(m=>m.id===b.dataset.edit);if(!m)return;let name=prompt('Nome da refeição',m.name);if(name===null)return;let desc=prompt('Descrição / porções',m.desc);if(desc===null)return;let protein=prompt('Proteína estimada em gramas (0 se não souber)',m.protein);if(protein===null)return;m.name=name.trim()||m.name;m.desc=desc.trim();m.protein=Math.max(0,Number(protein)||0);save();render();return}if(b.dataset.delete){if(confirm('Excluir esta refeição do cardápio?')){data.menu[selectedDay]=data.menu[selectedDay].filter(m=>m.id!==b.dataset.delete);save();render()}return}if(b.id==='addMeal'){let name=prompt('Nome da nova refeição');if(!name?.trim())return;let desc=prompt('Descrição / porções')||'';data.menu[selectedDay].push({id:crypto.randomUUID?crypto.randomUUID():Math.random().toString(36),name:name.trim(),desc,protein:0});save();render();return}if(b.id==='saveWeight'){let date=$('#weightDate').value,kg=Number($('#weightKg').value);if(!date||kg<20||kg>350){toast('Informe data e peso válidos');return}data.weights=data.weights.filter(w=>w.date!==date);data.weights.push({date,kg});save();render();toast('Peso registrado');return}if(b.dataset.delweight){if(confirm('Excluir esta pesagem?')){data.weights=data.weights.filter(w=>w.date!==b.dataset.delweight);save();render()}return}if(b.id==='saveSettings'){for(let id of ['waterGoal','proteinGoal','startingWeight','weightGoal']){let inp=$('#'+id);if(!inp.checkValidity()||!Number(inp.value)){toast('Revise as metas');return}data[id]=Number(inp.value)}save();render();toast('Metas salvas');return}if(b.id==='export'){let blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='meu-plano-backup-'+dateKey()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);return}if(b.id==='reset'){if(confirm('Apagar todo o histórico e restaurar o cardápio inicial? Esta ação não pode ser desfeita.')){data=structuredClone(defaults);save();render()}return}});
document.addEventListener('change',async e=>{let t=e.target;if(t.dataset.check){day().checked[t.dataset.check]=t.checked;save();render()}if(t.id==='weekday'){selectedDay=Number(t.value);render()}if(t.id==='extra'){day().extraProtein=Math.max(0,Number(t.value)||0);save();render()}if(t.id==='import'){let f=t.files?.[0];if(!f)return;try{let obj=JSON.parse(await f.text());if(!obj.menu||!obj.days||!Array.isArray(obj.weights))throw Error();if(confirm('Substituir os dados atuais pelos dados do backup?')){data={...structuredClone(defaults),...obj};save();render();toast('Backup importado')}}catch{toast('Arquivo de backup inválido')}}});document.addEventListener('keydown',e=>{if(e.target.id==='extra'&&e.key==='Enter')e.target.blur()});render();
</script></body></html>
